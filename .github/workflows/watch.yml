name: Dragoncon 2026 Registration Watcher

on:
  schedule:
    # Runs every 5 minutes. GitHub may delay this by a few minutes under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run registration check
        id: run_check
        run: |
          set -e
          OUTPUT=$(python3 check.py)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "NOTIFY_OPEN"; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send ntfy.sh push notification
        if: steps.run_check.outputs.notify == 'true'
        run: |
          curl -s \
            -H "Title: דרקוניקון 2026 - נפתח הרישום!" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "הרישום המוקדם לכנס דרקוניקון 2026 נפתח עכשיו! https://dragoncon.co.il/events" \
            "ntfy.sh/${{ secrets.NTFY_TOPIC }}"

      - name: Commit updated state
        run: |
          git config user.name "dragoncon-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update registration state"
          git push
